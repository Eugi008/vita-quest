<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#eaf7f0" />
<meta name="description" content="Forma Quest: trasforma il movimento e il mangiar sano in un gioco. Il tuo avatar dimagrisce insieme a te." />
<title>Forma Quest</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
:root{
  --bg1:#eaf7f0; --bg2:#fdf7ec; --card:#ffffff; --card2:#f6fbf8;
  --ink:#1e3a32; --ink2:#4a6b60; --muted:#7d968c; --line:#dbeae2;
  --green:#2f9e6f; --green2:#1f7d55; --mint:#8fe3c0;
  --orange:#f2913d; --orange2:#d97420;
  --red:#e2574c; --blue:#3d8fd6; --violet:#8b6ad6; --gold:#f0b93b;
  --shadow:0 6px 22px rgba(31,90,70,.10); --shadow-lg:0 14px 40px rgba(31,90,70,.18);
  --r:20px; --r2:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.45; color:var(--ink);
  background:
    radial-gradient(900px 500px at 15% -5%, #d7f2e5 0%, transparent 60%),
    radial-gradient(800px 500px at 95% 10%, #fdeccd 0%, transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;
  min-height:100dvh;
}
.app{max-width:600px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
h1,h2,h3,h4{margin:0;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,select{font-family:inherit;font-size:17px}
.hidden{display:none!important}
.center{text-align:center}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(150deg,var(--mint),var(--green));box-shadow:var(--shadow)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.iconbtn.off{opacity:.42}

/* ---------- Cards ---------- */
.card.sticky{position:sticky;top:-2px;z-index:8;box-shadow:0 10px 24px rgba(31,90,70,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card>h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--green2);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:800}
.card>h2 .sp{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:700;font-size:12px}
.sub{font-size:13px;color:var(--muted);margin-top:-6px;margin-bottom:12px}

/* ---------- Hero / avatar ---------- */
.hero{position:relative;overflow:hidden;padding:12px 16px 16px;
  background:linear-gradient(180deg,#ffffff,#f2fbf6)}
.hero-sky{position:absolute;inset:0;pointer-events:none;opacity:.5}
.stage{position:relative;display:grid;place-items:center;padding:4px 0 0}
.weightTag{position:relative;z-index:3;display:inline-flex;align-items:baseline;gap:6px;
  background:linear-gradient(150deg,#fff,#eefaf3);border:2px solid var(--green);border-radius:999px;
  padding:5px 16px;box-shadow:var(--shadow);font-weight:900;font-size:26px;color:var(--green2);
  font-variant-numeric:tabular-nums;transition:transform .25s}
.weightTag i{font-style:normal;font-size:14px;color:var(--ink2);font-weight:800}
.weightTag.bump{transform:scale(1.14)}
.weightTag.up{border-color:var(--orange);color:var(--orange2)}
.avatarName{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
#avatarWrap{position:relative;width:230px;height:280px;touch-action:none}
#avatarSvg{width:100%;height:100%;display:block;overflow:visible}
#avatarWrap.dropready #shadowRing{opacity:1;transform:scale(1)}
#shadowRing{position:absolute;inset:6% 4% 4%;border:3px dashed var(--green);border-radius:50%;
  opacity:0;transform:scale(.8);transition:.2s;pointer-events:none;background:rgba(143,227,192,.18)}
.moodMsg{min-height:22px;font-size:14px;color:var(--ink2);font-weight:700;text-align:center;margin-top:2px;padding:0 8px}

/* ---------- Bars ---------- */
.bar{height:14px;border-radius:9px;background:#e8f2ed;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
.bar.goal>span{background:linear-gradient(90deg,var(--mint),var(--green))}
.bar.xp>span{background:linear-gradient(90deg,#7fc4f5,var(--blue))}
.barlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:700}
.barlab b{color:var(--ink)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip b{color:var(--green2)}
.chip.fire b{color:var(--orange2)}

/* ---------- Buttons ---------- */
.btn{background:linear-gradient(150deg,var(--green),var(--green2));color:#fff;font-weight:800;
  border-radius:14px;padding:12px 18px;font-size:16px;box-shadow:0 5px 14px rgba(47,158,111,.28);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.full{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-weight:700}
.btn.orange{background:linear-gradient(150deg,var(--orange),var(--orange2));box-shadow:0 5px 14px rgba(242,145,61,.28)}
.btn.red{background:linear-gradient(150deg,#ef6a5f,var(--red));box-shadow:none}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.btn.big{padding:16px 20px;font-size:18px;border-radius:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>*{flex:1;min-width:130px}

/* ---------- Daily challenges ---------- */
.q{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r2);
  padding:11px 12px;margin-bottom:9px;background:var(--card2);transition:.25s}
.q .qi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
  background:#fff;border:1px solid var(--line);flex:0 0 auto}
.q .qb{flex:1;min-width:0}
.q .qb b{display:block;font-size:15.5px;font-weight:800}
.q .qb span{font-size:12.5px;color:var(--muted);font-weight:700}
.q.done{opacity:.62;background:#eefaf3;border-color:#bfe8d3}
.q.done .qb b{text-decoration:line-through}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-size:19px;color:transparent;flex:0 0 auto;background:#fff;transition:.2s}
.q.done .tick{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Food ---------- */
.foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.food{background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:9px 4px 7px;
  text-align:center;touch-action:none;user-select:none;transition:transform .12s,box-shadow .12s;position:relative}
.food:active{transform:scale(.94)}
.food .fe{font-size:31px;display:block;line-height:1.1;pointer-events:none}
.food .fn{font-size:11px;font-weight:800;color:var(--ink2);display:block;margin-top:2px;pointer-events:none}
.food.bad{background:#fff6ef;border-color:#f7ddc4}
.food.drag{opacity:.3}
.ghost-food{position:fixed;z-index:400;font-size:52px;pointer-events:none;transform:translate(-50%,-50%) scale(1.25);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));transition:opacity .2s}
.trash{margin-top:12px;border:2.5px dashed #f0c9a6;border-radius:var(--r2);padding:14px;text-align:center;
  color:var(--orange2);font-weight:800;font-size:14.5px;background:#fff8f1;transition:.2s}
.trash.ready{background:#ffe9d6;border-color:var(--orange);transform:scale(1.03)}
.legend{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}

/* ---------- Exercises ---------- */
.ex{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r2);
  padding:11px 12px;margin-bottom:9px;background:var(--card2)}
.ex .xi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:#fff;border:1px solid var(--line);flex:0 0 auto}
.ex .xb{flex:1;min-width:0}
.ex .xb b{display:block;font-size:16px;font-weight:800}
.ex .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.tag.d1{color:var(--green2);border-color:#bfe8d3;background:#eefaf3}
.tag.d2{color:var(--orange2);border-color:#f7ddc4;background:#fff6ef}
.tag.d3{color:var(--red);border-color:#f6cfcb;background:#fdeeed}
.tag.kg{color:var(--violet);border-color:#ded3f7;background:#f5f1ff}

/* ---------- Workout overlay ---------- */
#workout{position:fixed;inset:0;z-index:300;background:linear-gradient(180deg,#effaf5,#fdf6ea);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#workout h2{font-size:26px;font-weight:900}
#workout .wsub{color:var(--ink2);font-weight:700;font-size:15px;margin-top:4px}
.ring{position:relative;width:250px;height:250px;margin:8px 0}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rtxt{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.bignum{font-size:78px;font-weight:900;color:var(--green2);font-variant-numeric:tabular-nums;line-height:1}
.bignum.small{font-size:52px}
.wcue{font-size:22px;font-weight:900;color:var(--orange2);min-height:30px;letter-spacing:2px;text-transform:uppercase}
#wAvatar{width:170px;height:200px}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- Charts / analytics ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 9px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:900;color:var(--green2);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:2px;line-height:1.25}
.tile.o b{color:var(--orange2)} .tile.v b{color:var(--violet)} .tile.b b{color:var(--blue)}
.chart{width:100%;height:170px;display:block;overflow:visible}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.medal{text-align:center;padding:10px 5px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card2);opacity:.38;filter:grayscale(1)}
.medal.on{opacity:1;filter:none;border-color:var(--gold);background:#fffaeb;box-shadow:0 3px 10px rgba(240,185,59,.2)}
.medal .me{font-size:28px;display:block}
.medal .mn{font-size:10.5px;font-weight:800;color:var(--ink2);display:block;margin-top:3px;line-height:1.2}

/* ---------- Fact cards ---------- */
.fact{border-radius:var(--r2);padding:14px 15px;background:linear-gradient(150deg,#f4f0ff,#fbf9ff);
  border:1px solid #e2d9f7;margin-bottom:10px}
.fact .fcat{font-size:10.5px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--violet)}
.fact h4{font-size:16px;margin:3px 0 5px}
.fact p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.55}

/* ---------- Diary ---------- */
.log{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log:last-child{border-bottom:none}
.log .le{font-size:20px;flex:0 0 auto;width:26px;text-align:center}
.log .lb{flex:1;min-width:0}
.log .lb time{display:block;font-size:11px;color:var(--muted);font-weight:700}
.log .lk{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px;color:var(--green2);flex:0 0 auto}
.log .lk.up{color:var(--orange2)}

/* ---------- Nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.93);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{display:flex;max-width:600px;margin:0 auto}
.nav button{flex:1;padding:8px 2px 9px;font-size:10.5px;font-weight:800;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button .ni{font-size:22px;transition:transform .2s}
.nav button.on{color:var(--green2)}
.nav button.on .ni{transform:translateY(-3px) scale(1.12)}
.dot{position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #fff}

/* ---------- Modal / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(20,50,42,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + var(--safe-b));
  box-shadow:var(--shadow-lg);animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:88dvh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:21px;margin-bottom:6px}
.sheet p{color:var(--ink2);font-size:15px;margin:0 0 14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700}
.field input:focus,.field select:focus{outline:none;border-color:var(--green)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ---------- Toast + FX ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:rgba(30,58,50,.95);color:#fff;padding:11px 17px;border-radius:14px;font-weight:800;font-size:14.5px;
  box-shadow:var(--shadow-lg);animation:tin .3s cubic-bezier(.2,.9,.3,1);max-width:100%;text-align:center}
.toast small{display:block;font-weight:600;opacity:.82;font-size:12.5px;margin-top:1px}
.toast.ok{background:rgba(31,125,85,.96)} .toast.warn{background:rgba(217,116,32,.96)} .toast.bad{background:rgba(200,60,50,.96)}
@keyframes tin{from{transform:translateY(-22px);opacity:0}to{transform:translateY(0);opacity:1}}
#fxCanvas{position:fixed;inset:0;z-index:450;pointer-events:none}
.floaty{position:fixed;z-index:460;font-weight:900;font-size:24px;pointer-events:none;
  text-shadow:0 2px 6px rgba(255,255,255,.9);animation:floatUp 1.25s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.7);opacity:0}
  22%{transform:translate(-50%,-16px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-92px) scale(1);opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-6px)}78%{transform:translateX(4px)}}

/* ---------- Onboarding ---------- */
#intro{position:fixed;inset:0;z-index:250;background:linear-gradient(180deg,#eaf7f0,#fdf7ec);overflow:auto}
.introbox{max-width:520px;margin:0 auto;padding:26px 20px calc(30px + var(--safe-b));min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.introbox h1{font-size:30px;margin-bottom:8px}
.introbox p{color:var(--ink2);font-size:16px;margin:0 0 18px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.steps i.on{background:var(--green);width:22px;border-radius:6px}
@media (max-width:360px){ body{font-size:16px} .bignum{font-size:64px} .ring{width:210px;height:210px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="intro" class="hidden"><div class="introbox" id="introBody"></div></div>

<div class="app" id="app">
  <div class="topbar">
    <div class="logo">🍏</div>
    <div class="brand"><b>Forma Quest</b><small>la tua avventura leggera</small></div>
    <button class="iconbtn" id="btnMusic" title="Musica">🎵</button>
    <button class="iconbtn" id="btnSfx" title="Effetti sonori">🔊</button>
  </div>

  <div id="view"></div>
</div>

<nav class="nav"><div class="nav-in" id="nav">
  <button data-tab="casa" class="on"><span class="ni">🧍</span>Avatar</button>
  <button data-tab="cibo"><span class="ni">🍎</span>Cibo</button>
  <button data-tab="muovi"><span class="ni">💪</span>Muovi</button>
  <button data-tab="analisi"><span class="ni">📊</span>Analisi</button>
  <button data-tab="setup"><span class="ni">⚙️</span>Setup</button>
</div></nav>

<div id="workout" class="hidden"></div>
<div id="modal"></div>
<div id="toasts"></div>
<canvas id="fxCanvas"></canvas>

<script>
"use strict";
/* =========================================================================
   FORMA QUEST — app PWA offline, tutti i dati restano sul dispositivo
   Salvataggio: localStorage["formaQuestSave"]  (nessun server, nessun account)
   ========================================================================= */

const SAVE_KEY = 'formaQuestSave';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=(n)=>Math.round(n*10)/10;
const r2=(n)=>Math.round(n*100)/100;
const now=()=>new Date();
const dayKey=(d=now())=>{const x=new Date(d);x.setHours(0,0,0,0);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const daysBetweenKeys=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const fmtDate=(k)=>{const d=new Date(k+'T00:00:00');
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});};

/* =========================================================================
   1. BILANCIAMENTO
   ========================================================================= */
const BAL = {
  pesoStart: 100,        // peso di partenza dell'avatar (non del papà!)
  obiettivoDefault: 78,
  malusDopoGiorni: 2,    // giorni di inattività tollerati
  malusKgGiorno: 0.2,    // kg guadagnati per ogni giorno extra di inattività
  malusMaxGiorno: 1.0,   // tetto per singolo giorno
  capKgGiorno: 1.2,      // massimo dimagrimento avatar in un giorno (anti-abbuffata di tap)
  maxCibiGiorno: 8,      // registrazioni cibo che danno effetto in un giorno
  livelloBase: 120, livelloEsp: 1.32,
  ranghi:[
    {min:1 , nome:'Bradipo Riposato', ico:'🦥'},
    {min:3 , nome:'Camminatore Curioso', ico:'🚶'},
    {min:5 , nome:'Domatore di Scale', ico:'🪜'},
    {min:8 , nome:'Guerriero del Mattino', ico:'🌅'},
    {min:12, nome:'Muscolo Emergente', ico:'💪'},
    {min:16, nome:'Cintura Stretta', ico:'🥋'},
    {min:21, nome:'Leggenda in Forma', ico:'🏆'}
  ]
};
function sogliaXp(L){ return Math.round(BAL.livelloBase*Math.pow(L,BAL.livelloEsp)); }
function xpCumulati(L){ let t=0; for(let i=1;i<L;i++) t+=sogliaXp(i); return t; }
function livelloDaXp(xp){ let L=1; while(xpCumulati(L+1)<=xp) L++; return L; }
function rangoPer(L){ let r=BAL.ranghi[0]; for(const x of BAL.ranghi) if(L>=x.min) r=x; return r; }
function progressoLivello(xp){
  const L=livelloDaXp(xp), base=xpCumulati(L), next=xpCumulati(L+1);
  return {L, dentro:xp-base, serve:next-base, perc:clamp((xp-base)/(next-base)*100,0,100)};
}

  // migrazione morbida: riempi campi mancanti
  const base=statoNuovo();
  for(const k in base) if(S[k]===undefined) S[k]=base[k];
  for(const k in base.contatori) if(S.contatori[k]===undefined) S.contatori[k]=0;
  for(const k in base.audio) if(S.audio[k]===undefined) S.audio[k]=base.audio[k];
}
function salva(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

}

   8. AUDIO — musica rilassata e suoni generati dal vivo (nessun file esterno)
   ========================================================================= */
const AU = {
  ctx:null, master:null, mus:null, sfx:null, verb:null,
  on:false, timer:null, step:0, nextAt:0,

  ensure(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value=0.9; this.master.connect(this.ctx.destination);
      // riverbero: impulso generato proceduralmente
      this.verb = this.ctx.createConvolver();
      const len = this.ctx.sampleRate*2.4, buf=this.ctx.createBuffer(2,len,this.ctx.sampleRate);
      for(let c=0;c<2;c++){ const d=buf.getChannelData(c);
        for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      this.verb.buffer=buf;
      const vg=this.ctx.createGain(); vg.gain.value=0.32; this.verb.connect(vg); vg.connect(this.master);
      this.mus = this.ctx.createGain(); this.mus.gain.value=0; this.mus.connect(this.master); this.mus.connect(this.verb);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value=0.55; this.sfx.connect(this.master); this.sfx.connect(this.verb);
      return true;
    }catch(e){ return false; }
  },

  /* ---- musica: pad lento su giro Am – F – C – G ---- */
  ACCORDI:[
    [110.00,164.81,220.00,329.63], // Am
    [ 87.31,174.61,261.63,349.23], // F
    [130.81,196.00,261.63,392.00], // C
    [ 98.00,146.83,246.94,392.00]  // G
  ],
  PENTA:[440,493.88,587.33,659.25,880,987.77],

  musicaOn(){
    if(!this.ensure()) return;
    if(this.on) return;
    this.on=true;
    this.mus.gain.cancelScheduledValues(this.ctx.currentTime);
    this.mus.gain.setValueAtTime(this.mus.gain.value, this.ctx.currentTime);
    this.mus.gain.linearRampToValueAtTime(0.20, this.ctx.currentTime+3);
    this.nextAt = this.ctx.currentTime+0.1;
    this.tick();
    this.timer = setInterval(()=>this.tick(), 1000);
  },
  musicaOff(){
    this.on=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.ctx&&this.mus){
      this.mus.gain.cancelScheduledValues(this.ctx.currentTime);
      this.mus.gain.setValueAtTime(this.mus.gain.value, this.ctx.currentTime);
      this.mus.gain.linearRampToValueAtTime(0, this.ctx.currentTime+1.6);
    }
  },
  tick(){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime;
    while(this.nextAt < t+2){
      this.accordo(this.ACCORDI[this.step%4], this.nextAt, 7.6);
      if(this.step%2===1) this.campana(this.nextAt+1.6+Math.random()*3);
      this.nextAt += 7.2; this.step++;
    }
  },
  accordo(freqs, at, dur){
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.30, at+2.4);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    const f=this.ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(500,at); f.frequency.linearRampToValueAtTime(1150, at+dur*0.5);
    f.Q.value=0.6;
    g.connect(f); f.connect(this.mus);
    freqs.forEach((fr,i)=>{
      [0,-5,5].slice(0, i===0?1:2).forEach(det=>{
        const o=this.ctx.createOscillator();
        o.type = i===0?'sine':'triangle';
        o.frequency.value=fr; o.detune.value=det;
        const og=this.ctx.createGain(); og.gain.value = i===0?0.5:0.22;
        o.connect(og); og.connect(g); o.start(at); o.stop(at+dur+0.2);
      });
    });
  },
  campana(at){
    if(at < this.ctx.currentTime) return;
    const fr=this.PENTA[Math.floor(Math.random()*this.PENTA.length)];
    const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=fr;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.10, at+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, at+3.2);
    o.connect(g); g.connect(this.mus); o.start(at); o.stop(at+3.4);
  },

  /* ---- effetti sonori ---- */
  beep(f1,f2,dur,type='sine',vol=0.5,delay=0){
    if(!S||!S.audio.sfx) return;
    if(!this.ensure()) return;
    const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(f1,t);
    if(f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+dur+0.05);
  },
  rumore(dur=0.35,vol=0.25,f=1200){
    if(!S||!S.audio.sfx||!this.ensure()) return;
    const t=this.ctx.currentTime, n=this.ctx.sampleRate*dur;
    const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.8);
    const s=this.ctx.createBufferSource(); s.buffer=b;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(f,t);
    bp.frequency.exponentialRampToValueAtTime(f*0.28,t+dur);
    const g=this.ctx.createGain(); g.gain.value=vol;
    s.connect(bp); bp.connect(g); g.connect(this.sfx); s.start(t);
  },
  pop(){ this.beep(620,980,0.13,'sine',0.42); },
  buono(){ [0,0.09,0.18].forEach((d,i)=>this.beep([659.25,830.61,987.77][i],[659.25,830.61,987.77][i],0.32,'sine',0.34,d)); },
  cattivo(){ this.beep(240,90,0.34,'sawtooth',0.26); this.rumore(0.25,0.12,500); },
  successo(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.beep(f,f,0.42,'triangle',0.32,i*0.1)); },
  livello(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>this.beep(f,f,0.6,'triangle',0.36,i*0.13)); this.rumore(0.6,0.1,2400); },
  tic(){ this.beep(880,880,0.06,'square',0.16); },
  toc(){ this.beep(440,440,0.09,'square',0.2); },
  via(){ this.beep(1046.5,1046.5,0.28,'square',0.3); },
  swoosh(){ this.rumore(0.3,0.18,2000); }
};

const FX = {
  cv:null, ctx:null, parts:[], raf:null,
  init(){
    this.cv=$('#fxCanvas'); this.ctx=this.cv.getContext('2d'); this.resize();
    addEventListener('resize', ()=>this.resize());
  },
  resize(){
    const d=devicePixelRatio||1;
    this.cv.width=innerWidth*d; this.cv.height=innerHeight*d;
    this.cv.style.width=innerWidth+'px'; this.cv.style.height=innerHeight+'px';
    this.ctx.setTransform(d,0,0,d,0,0);
  },
  burst(x,y,n=34,colors=['#2f9e6f','#8fe3c0','#f0b93b','#3d8fd6','#f2913d']){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=2.4+Math.random()*7;
      this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.2,
        g:0.24, life:1, dec:0.012+Math.random()*0.012,
        w:5+Math.random()*7, h:4+Math.random()*8, rot:Math.random()*6.3, vr:(Math.random()-0.5)*0.35,
        c:colors[Math.floor(Math.random()*colors.length)], sh:Math.random()<0.35?'c':'r'});
    }
    this.run();
  },
  pioggia(n=70){
    for(let i=0;i<n;i++){
      this.parts.push({x:Math.random()*innerWidth, y:-20-Math.random()*260,
        vx:(Math.random()-0.5)*1.6, vy:1.6+Math.random()*2.6, g:0.045, life:1, dec:0.0042,
        w:6+Math.random()*7, h:5+Math.random()*9, rot:Math.random()*6.3, vr:(Math.random()-0.5)*0.28,
        c:['#2f9e6f','#8fe3c0','#f0b93b','#3d8fd6','#f2913d','#8b6ad6'][Math.floor(Math.random()*6)], sh:'r'});
    }
    this.run();
  },
  scintille(x,y,n=16,c='#f0b93b'){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=1+Math.random()*3.5;
      this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.02,life:1,dec:0.026,
        w:3+Math.random()*3,h:3+Math.random()*3,rot:0,vr:0.2,c,sh:'c'});
    }
    this.run();
  },
  run(){ if(!this.raf) this.raf=requestAnimationFrame(()=>this.loop()); },
  loop(){
    const c=this.ctx; c.clearRect(0,0,innerWidth,innerHeight);
    this.parts=this.parts.filter(p=>{
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=p.dec;
      if(p.life<=0||p.y>innerHeight+60) return false;
      c.save(); c.globalAlpha=Math.max(0,Math.min(1,p.life)); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.c;
      if(p.sh==='c'){ c.beginPath(); c.arc(0,0,p.w/2,0,6.3); c.fill(); }
      else c.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      c.restore(); return true;
    });
    if(this.parts.length) this.raf=requestAnimationFrame(()=>this.loop());
    else { this.raf=null; c.clearRect(0,0,innerWidth,innerHeight); }
  }
};

/* fattore pancia da peso */

}
function umore(){
  if(!S.ultimoGiornoAttivo) return 0.3;
  const g=daysBetweenKeys(S.ultimoGiornoAttivo, dayKey());

/* =========================================================================
   11. LOGICA DI GIOCO
   ========================================================================= */
function addDays(key,n){ const d=new Date(key+'T00:00:00'); d.setDate(d.getDate()+n); return dayKey(d); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); }

function sfideDelGiorno(){
  const seed=hash('sfide'+dayKey()), out=[], usati=new Set();
  for(let i=0;i<3;i++){
    let k=(seed+i*7919)%SFIDE.length;
    while(usati.has(k)) k=(k+1)%SFIDE.length;
    usati.add(k); out.push(SFIDE[k]);
  }
  return out;
}
function curiositaDelGiorno(){
  const g=Math.floor(new Date(dayKey()+'T00:00:00')/86400000);
  return CURIOSITA[g % CURIOSITA.length];
}

function segnaStorico(){
  const k=dayKey(), ult=S.storico[S.storico.length-1];
  if(ult && ult.d===k) ult.kg=r2(S.pesoAvatar);
  else S.storico.push({d:k, kg:r2(S.pesoAvatar)});
  if(S.storico.length>400) S.storico.shift();
}

/* --- cambio giorno + malus da inattività --- */
function controlloGiorno(){
  const oggi=dayKey();
  if(!S.oggi || S.oggi.d!==oggi) S.oggi={d:oggi, kgTolti:0, cibi:0, sfide:[], azioni:0};
  if(S.ultimoCheck===oggi){ segnaStorico(); return null; }

  const rif = S.ultimoGiornoAttivo || S.creato || oggi;
  let malus=0, giorniMalus=0, d=S.ultimoCheck||oggi;
  let guardia=0;
  while(d!==oggi && guardia++<800){
    d=addDays(d,1);
    const inattivo=daysBetweenKeys(rif, d);
    if(inattivo > BAL.malusDopoGiorni){
      malus += BAL.malusKgGiorno; giorniMalus++;
    }
  }
  malus=Math.min(malus, 3);           // il malus non affonda mai la partita
  S.ultimoCheck=oggi;

  // la serie si spezza se è passato più di un giorno
  if(S.ultimoGiornoAttivo && daysBetweenKeys(S.ultimoGiornoAttivo, oggi)>1) S.streak=0;

  if(malus>0){
    S.pesoAvatar=r2(S.pesoAvatar+malus);
    diario('😴', `${giorniMalus} giorni di riposo forzato: ${S.nomeAvatar} ha ripreso peso`, malus, 'up');
  }
  segnaStorico(); salva();
  return malus>0 ? {malus, giorni:daysBetweenKeys(rif,oggi)} : null;
}

/* --- applica una qualsiasi azione --- */
function azione({kg=0, xp=0, ico='✨', testo='', tipo='', quiet=false, origine=null}){
  const oggi=dayKey();
  if(S.oggi.d!==oggi) S.oggi={d:oggi,kgTolti:0,cibi:0,sfide:[],azioni:0};

  // tetto giornaliero al dimagrimento (niente maratone di tap)
  let kgEff=kg;
  if(kg<0){
    const spazio=Math.max(0, BAL.capKgGiorno - S.oggi.kgTolti);
    kgEff=-Math.min(-kg, spazio);
    S.oggi.kgTolti=r2(S.oggi.kgTolti + (-kgEff));
  }
  const prima=S.pesoAvatar;
  S.pesoAvatar=r2(clamp(S.pesoAvatar+kgEff, 45, 200));
  const deltaVero=r2(S.pesoAvatar-prima);

  const xpPrima=S.xp, lvPrima=livelloDaXp(S.xp);
  S.xp+=xp;
  const lvDopo=livelloDaXp(S.xp);

  S.contatori.azioni++; S.oggi.azioni++;
  if(kg<0 || tipo==='sgarro'){
    // qualunque interazione consapevole tiene viva la serie
    if(S.ultimoGiornoAttivo!==oggi){
      const g = S.ultimoGiornoAttivo ? daysBetweenKeys(S.ultimoGiornoAttivo,oggi) : 99;
      S.streak = (g===1)? S.streak+1 : 1;
      S.recordStreak=Math.max(S.recordStreak||0, S.streak);
      S.ultimoGiornoAttivo=oggi;
    }
  }
  if(testo) diario(ico, testo, deltaVero, deltaVero>0?'up':'');
  segnaStorico();

  const nuove=controllaMedaglie();
  salva();

  if(!quiet) feedback({deltaVero, xp, kgBloccato:(kg<0 && kgEff>kg), origine});
  if(lvDopo>lvPrima) setTimeout(()=>festaLivello(lvDopo), 500);
  nuove.forEach((m,i)=>setTimeout(()=>{
    AU.successo(); toast('🏅 Medaglia: '+m.n,'Guardala nella sezione Analisi','ok');
  }, 900+i*900));

  render();
  return {deltaVero, xpDato:xp};
}

function feedback({deltaVero, xp, kgBloccato, origine}){
  const p = origine || (avatarHome ? avatarHome.centro() : {x:innerWidth/2, y:innerHeight*0.35});
  if(deltaVero<0){
    floaty(r1(deltaVero).toFixed(1)+' kg', p.x, p.y, '#2f9e6f');
    if(xp) floaty('+'+xp+' XP', p.x+58, p.y+26, '#3d8fd6');
    FX.burst(p.x, p.y, 30);
    AU.buono(); vibra(28);
  }else if(deltaVero>0){
    floaty('+'+r1(deltaVero).toFixed(1)+' kg', p.x, p.y, '#d97420');
    AU.cattivo(); vibra([20,50,20]);
    if(avatarHome) avatarHome.scuoti();
  }else if(kgBloccato){
    floaty('+'+xp+' XP', p.x, p.y, '#3d8fd6');
    AU.pop();
    toast('Per oggi basta così 💚','Il corpo cambia col riposo, non solo con la fatica','warn');
  }
}

function controllaMedaglie(){

}

function frasiUmore(){
  const g = S.ultimoGiornoAttivo ? daysBetweenKeys(S.ultimoGiornoAttivo, dayKey()) : 99;
  if(g===0) return ['Oggi ci siamo dati da fare 💪','Mi sento più leggero, grazie!','Bella giornata, continuiamo così.'][S.oggi.azioni%3];
  if(g===1) return 'Ieri è andata bene. Oggi che si fa?';
  if(g===2) return 'Due giorni di divano… la cintura inizia a stringere.';
  if(g>2 && g<90) return `Sono ${g} giorni che non ci muoviamo. Sto rimettendo su tutto! 😰`;
  return 'Pronti a partire? Bastano 5 squat.';
}

/* --- trascinamento cibo (funziona con dito e con mouse) --- */
function abilitaTrascinamento(root){
  const wrap=$('#avatarWrap',root), trash=$('#trash',root), ring=$('#shadowRing',root);
  $$('.food',root).forEach(el=>{
    let ghost=null, sx=0, sy=0, dragging=false, pid=null;
    const dentro=(r,x,y)=>x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10;
    const evidenzia=(x,y)=>{
      const a=wrap&&dentro(wrap.getBoundingClientRect(),x,y);
      const t=trash&&dentro(trash.getBoundingClientRect(),x,y);
      wrap&&wrap.classList.toggle('dropready',!!a);
      trash&&trash.classList.toggle('ready',!!t);
      return {a,t};
    };
    el.addEventListener('pointerdown',(e)=>{
      pid=e.pointerId; sx=e.clientX; sy=e.clientY; dragging=false;
      el.setPointerCapture(pid);
    });
    el.addEventListener('pointermove',(e)=>{
      if(pid!==e.pointerId) return;
      if(!dragging){
        if(Math.hypot(e.clientX-sx,e.clientY-sy)<9) return;
        dragging=true; el.classList.add('drag');
        ghost=document.createElement('div');
        ghost.className='ghost-food'; ghost.textContent=$('.fe',el).textContent;
        document.body.appendChild(ghost); AU.swoosh();
      }
      ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      evidenzia(e.clientX,e.clientY);
      e.preventDefault();
    },{passive:false});
    const fine=(e)=>{
      if(pid!==e.pointerId) return;
      try{ el.releasePointerCapture(pid); }catch(err){}
      pid=null;
      const cibo=CIBI.find(c=>c.id===el.dataset.cibo);
      if(!dragging){ scegliCibo(cibo, el.getBoundingClientRect()); return; }
      dragging=false; el.classList.remove('drag');
      const {a,t}=evidenzia(e.clientX,e.clientY);
      wrap&&wrap.classList.remove('dropready'); trash&&trash.classList.remove('ready');
      if(ghost){ ghost.style.opacity='0'; const g=ghost; setTimeout(()=>g.remove(),200); ghost=null; }
      const punto={x:e.clientX,y:e.clientY};
      if(a) mangia(cibo, punto);
      else if(t) resisti(cibo, punto);
      else AU.pop();
    };
    el.addEventListener('pointerup',fine);
    el.addEventListener('pointercancel',fine);
  });
}

        <circle id="wRing" cx="125" cy="125" r="118" fill="none" stroke="#2f9e6f" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="rtxt"><div id="wAvatar"></div></div>
    </div>
    <div class="bignum${x.tipo==='time'&&x.sec>=60?' small':''}" id="wNum">3</div>
    <div class="wcue" id="wCue">PRONTI</div>
    <div class="btnrow" style="width:100%;max-width:340px;margin-top:16px">
      <button class="btn ghost" id="wPause">⏸ Pausa</button>
      <button class="btn red" id="wStop">Ho finito</button>
    </div>`;
  W.av=AvatarView($('#wAvatar'));
  W.av.set(fattorePancia(S.pesoAvatar), 0.6, false);
  W.av.respira(true);
  $('#wPause').onclick=()=>{
    W.pausa=!W.pausa;
    $('#wPause').textContent = W.pausa? '▶️ Riprendi' : '⏸ Pausa';
  };
  $('#wStop').onclick=()=>interrompi(x);
  countdown(x, tot, C);
}

function countdown(x, tot, C){
  let n=3;
  $('#wNum').textContent=n; $('#wCue').textContent='PRONTI';
  AU.tic(); parla('Pronti');
  W.t=setInterval(()=>{
    if(!W) return;
    if(W.pausa) return;
    n--;
    if(n>0){ $('#wNum').textContent=n; AU.tic(); $('#wNum').classList.remove('pulse'); void $('#wNum').offsetWidth; $('#wNum').classList.add('pulse'); }
    else{ clearInterval(W.t); $('#wCue').textContent='VIA!'; AU.via(); parla('Via'); vibra(40);
      setTimeout(()=>eseguiEsercizio(x,tot,C), 500); }
  },800);
}

function eseguiEsercizio(x, tot, C){
  if(!W) return;
  let fatte=0, fase=0, elapsed=0;
  const ring=$('#wRing'), num=$('#wNum'), cue=$('#wCue');
  const passo=100;
  if(x.tipo==='reps'){
    const mezzo=(x.tempo*1000)/2;
    num.textContent='0';
    let tFase=0;
    W.av.squat(true, mezzo); cue.textContent=x.cue[0]; AU.toc();
    W.t=setInterval(()=>{
      if(!W||W.pausa) return;
      tFase+=passo;
      if(tFase>=mezzo){
        tFase=0; fase^=1;
        W.av.squat(fase===0, mezzo);
        cue.textContent=x.cue[fase%x.cue.length]||x.cue[0];
        AU.toc();
        if(fase===0){
          fatte++;
          num.textContent=fatte;
          num.classList.remove('pulse'); void num.offsetWidth; num.classList.add('pulse');
          AU.pop(); vibra(18); parla(String(fatte));
          if(fatte%3===0) W.av.sudore();
          ring.setAttribute('stroke-dashoffset', C*(1-fatte/tot));
          if(fatte>=tot){ clearInterval(W.t); completa(x, tot, tot); }
        }
      }
    },passo);
  }else{
    let restano=x.sec;
    num.textContent=fmtSec(restano);
    cue.textContent=x.cue[0];
    let su=false;
    W.t=setInterval(()=>{
      if(!W||W.pausa) return;
      elapsed+=passo;
      if(elapsed%600===0){ su=!su; W.av.squat(su, 600); }
      if(elapsed%1000===0){
        restano--;
        num.textContent=fmtSec(restano);
        ring.setAttribute('stroke-dashoffset', C*(restano/x.sec));
        if(restano<=5&&restano>0){ AU.tic(); num.classList.remove('pulse'); void num.offsetWidth; num.classList.add('pulse'); }
        else if(restano%15===0&&restano>0){ AU.toc(); }
        if(restano<=0){ clearInterval(W.t); completa(x, x.sec, x.sec); }
      }
    },passo);
  }
}
function fmtSec(s){ return s>=60 ? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : String(s); }

function interrompi(x){
  if(W&&W.t) clearInterval(W.t);
  const tot = x.tipo==='reps'? x.reps : x.sec;
  const fattoOra = x.tipo==='reps' ? Number($('#wNum').textContent)||0 : tot-(Number(String($('#wNum').textContent).split(':').reduce((a,b)=>a*60+Number(b),0))||0);
  apriSheet(`
    <h3>Quanto hai fatto?</h3>
    <p>Nessun giudizio: conta quello che hai davvero fatto. Anche metà vale.</p>
    <div class="field"><label>${x.tipo==='reps'?'Ripetizioni':'Secondi'} completati</label>
      <input type="number" id="qFatto" value="${clamp(Math.round(fattoOra),0,tot)}" min="0" max="${tot}" inputmode="numeric"></div>
    <button class="btn full big" id="qOk">Registra</button>`,
    (sh)=>{
      $('#qOk',sh).onclick=()=>{
        const q=clamp(Number($('#qFatto',sh).value)||0, 0, tot);
        chiudiSheet(); completa(x, q, tot);
      };
    }, true);
}

function completa(x, fatte, tot){
  const frac = tot? clamp(fatte/tot,0,1) : 0;
  if(frac<=0){
    toast('Nessun problema 💚','Anche solo aprire l\'app conta. Riprova quando te la senti.','warn');
    W.i++; setTimeout(()=>W? prossimoEsercizio():null, 400); return;
  }
  FX.pioggia(frac>=1?70:40); AU.successo(); vibra([30,50,60]);
  W.av && W.av.salta();
  W.fatti.push({x, fatte, frac});
  const durata = x.tipo==='reps'? (x.reps*x.tempo)/60 : x.sec/60;
  S.contatori.esercizi++;
  S.contatori.reps += (x.tipo==='reps'? Math.round(fatte):0);
  S.contatori.minuti += Math.round(durata*frac);
  azione({
    kg: x.kg*Math.max(frac,0.35), xp: Math.round(x.xp*Math.max(frac,0.35)),
    ico:x.e, testo:`${x.n}: ${Math.round(fatte)}${x.tipo==='reps'?' ripetizioni':' sec'}`,
    tipo:'esercizio', quiet:true
  });
  const num=$('#wNum'), cue=$('#wCue');
  if(cue) cue.textContent = frac>=1? 'FATTO! 🎉' : 'BRAVO!';
  if(num) num.textContent = '✓';
  parla(frac>=1? 'Bravo, completato!' : 'Bravo!');
  W.i++;
  setTimeout(()=>{ if(!W) return; W.i<W.lista.length? prossimoEsercizio() : fineAllenamento(); }, 1600);
}

function fineAllenamento(){
  const fatti=W?W.fatti:[];
  const kg=fatti.reduce((a,f)=>a+f.x.kg*Math.max(f.frac,0.35),0);
  const xp=fatti.reduce((a,f)=>a+Math.round(f.x.xp*Math.max(f.frac,0.35)),0);
  $('#workout').innerHTML=`
    <div style="font-size:72px">🎉</div>
    <h2>Allenamento finito!</h2>
    <div class="wsub" style="margin-bottom:16px">${esc(S.nomeAvatar)} ti ringrazia.</div>
    <div class="tiles" style="width:100%;max-width:360px">
      <div class="tile"><b>${fatti.length}</b><span>esercizi</span></div>
      <div class="tile v"><b>${r1(kg).toFixed(1)}</b><span>kg avatar</span></div>
      <div class="tile b"><b>+${xp}</b><span>XP</span></div>
    </div>
    <div style="font-size:34px;font-weight:900;color:var(--green2);margin-top:18px">${S.pesoAvatar.toFixed(1)} kg</div>
    <button class="btn big" style="margin-top:18px;min-width:220px" id="wClose">Torna a casa</button>`;
  FX.pioggia(110); AU.livello();
  $('#wClose').onclick=chiudiAllenamento;
  salva();
}

function rigaDiario(d){
  const t=new Date(d.t);

    <div class="lb">${esc(d.x)}<time>${t.toLocaleDateString('it-IT',{day:'numeric',month:'short'})} · ${t.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</time></div>
    ${q?`<div class="lk ${d.c==='up'?'up':''}">${q}</div>`:''}</div>`;
}
function cartaCuriosita(c){
  return `<div class="fact"><div class="fcat">${esc(c.cat)}</div><h4>${esc(c.t)}</h4><p>${esc(c.c)}</p></div>`;
}

function grafico(punti, colore){
  if(!punti || punti.length<2)
    return '<div class="sub" style="margin:0">Servono almeno due misurazioni per disegnare la linea.</div>';
  const p=punti.slice(-30);
  const W=100, H=100, pad=6;
  const vals=p.map(x=>x.kg);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(max-min<1){ const m=(max+min)/2; min=m-0.5; max=m+0.5; }
  const X=i=>pad + i*(W-pad*2)/(p.length-1);
  const Y=v=>pad + (max-v)/(max-min)*(H-pad*2);
  const d=p.map((x,i)=>(i?'L':'M')+X(i).toFixed(2)+' '+Y(x.kg).toFixed(2)).join(' ');
  const area=d+` L ${X(p.length-1).toFixed(2)} ${H} L ${X(0).toFixed(2)} ${H} Z`;
  const gid='g'+(++uid);
  return `<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${colore}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${colore}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${colore}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
      vector-effect="non-scaling-stroke"/>
    <circle cx="${X(p.length-1).toFixed(2)}" cy="${Y(p[p.length-1].kg).toFixed(2)}" r="2.4" fill="${colore}"/>
  </svg>
  <div class="barlab" style="margin:4px 0 0"><span>${fmtDate(p[0].d)} · ${p[0].kg.toFixed(1)} kg</span>
    <b>${fmtDate(p[p.length-1].d)} · ${p[p.length-1].kg.toFixed(1)} kg</b></div>`;
}

function bmiInfo(){
  const ult=S.pesiReali[S.pesiReali.length-1];
  if(!ult || !S.altezza) return null;
  const h=S.altezza/100, b=ult.kg/(h*h);
  let lab='Normopeso', col='var(--green2)';
  if(b<18.5){ lab='Sottopeso'; col='var(--blue)'; }
  else if(b<25){ lab='Normopeso'; col='var(--green2)'; }
  else if(b<30){ lab='Sovrappeso'; col='var(--orange2)'; }
  else { lab='Obesità'; col='var(--red)'; }
  return {bmi:b, lab, col, kg:ult.kg};
}

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='forma-quest-backup-'+dayKey()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Backup scaricato 💾','Salvalo in una mail o su Drive','ok');
  };
  $('#importa',v).onclick=()=>$('#fileIn',v).click();
  $('#fileIn',v).onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d || typeof d.pesoAvatar!=='number') throw 0;
        S=d;
        const base=statoNuovo(); for(const k in base) if(S[k]===undefined) S[k]=base[k];
        salva(); toast('Backup ripristinato ✅','','ok'); vai('casa');
      }catch(err){ toast('File non valido','Serve un backup di Forma Quest','bad'); }
    };
    rd.readAsText(f);
  };
  $('#installa',v).onclick=async()=>{
    if(promptInstall){ promptInstall.prompt(); const r=await promptInstall.userChoice;
      if(r.outcome==='accepted') toast('Installata! 🎉','La trovi tra le app','ok'); promptInstall=null; }
    else apriSheet(`<h3>📲 Aggiungi alla Home</h3>
      <p>Il tuo browser non offre il pulsante automatico. Fai così:</p>
      <div class="legend" style="font-size:15px">
        <b>iPhone / iPad (Safari):</b> tocca il tasto <b>Condividi ⬆️</b> in basso, poi <b>«Aggiungi alla schermata Home»</b>.<br><br>
        <b>Android (Chrome):</b> tocca il menu <b>⋮</b> in alto a destra, poi <b>«Installa app»</b>.
      </div>
      <button class="btn full big" style="margin-top:14px" data-close>Ho capito</button>`);
  };
  $('#azzera',v).onclick=()=>{
    apriSheet(`<h3>Ricominciare da capo?</h3>
      <p>Perderai diario, XP, medaglie e il peso dell'avatar tornerà a ${BAL.pesoStart} kg. Non si torna indietro.</p>
      <button class="btn red full big" id="siAzzera">Sì, cancella tutto</button>
      <button class="btn ghost full" style="margin-top:8px" data-close>No, annulla</button>`,
      (sh)=>{ $('#siAzzera',sh).onclick=()=>{
        const look=S.look, nome=S.nomeAvatar, audio=S.audio;
        S=statoNuovo(); S.look=look; S.nomeAvatar=nome; S.audio=audio; S.onboarded=true;
        salva(); chiudiSheet(); vai('casa'); toast('Si riparte da zero 🌱','','ok'); };
      });
  };
}

/* =========================================================================
   16. SHEET / MODALI
   ========================================================================= */
function apriSheet(html, dopo, sopraTutto=false){
  const m=$('#modal');
  m.innerHTML=`<div class="scrim"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
  if(sopraTutto) $('.scrim',m).style.zIndex='400';
  const scrim=$('.scrim',m), sheet=$('.sheet',m);
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) chiudiSheet(); });
  $$('[data-close]',sheet).forEach(b=>b.onclick=chiudiSheet);
  AU.swoosh();
  dopo&&dopo(sheet);
}
function chiudiSheet(){ $('#modal').innerHTML=''; }

function vai(tab){ vista=tab; scrollTo({top:0,behavior:'smooth'}); AU.pop(); render(); }

/* =========================================================================
   17. PRIMO AVVIO
   ========================================================================= */
let passo=0, avIntro=null;
function mostraIntro(){
  $('#intro').classList.remove('hidden');
  $('#app').style.display='none'; $('.nav').style.display='none';
  disegnaIntro();
}
function pallini(){ return `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i===passo?'on':''}"></i>`).join('')}</div>`; }
function disegnaIntro(){
  const b=$('#introBody');
  if(passo===0){
    b.innerHTML=`${pallini()}
      <div style="width:190px;height:230px;margin:0 auto"><div id="introAv" style="width:100%;height:100%"></div></div>
      <h1 class="center">Ciao! Sono il tuo avatar.</h1>
      <p class="center">Peso <b>100 kg</b> e ho una certa pancetta. Ogni volta che <b>tu</b> fai qualcosa di buono nella vita vera — cinque squat, una mela, una passeggiata — io divento più leggero.</p>
      <p class="center">E se ti fermi troppo… ricomincio a ingrassare. Quindi conto su di te.</p>
      <button class="btn full big" id="next">Piacere! 👋</button>`;
    avIntro=AvatarView($('#introAv')); avIntro.set(1, 0.4, false); avIntro.respira(true);
  }
  if(passo===1){
    b.innerHTML=`${pallini()}
      <h1>Come mi chiamo?</h1>
      <p>Dammi un nome: sarà più divertente prendersela con me.</p>
      <div class="field"><label>Nome</label><input id="iNome" value="${esc(S.nomeAvatar)}" maxlength="16"></div>
      <div class="field"><label>Capelli</label><select id="iCapelli">
        <option value="grigi">Grigi</option><option value="castani">Castani</option>
        <option value="bianchi">Bianchi</option><option value="calvo">Senza capelli</option></select></div>
      <div class="field"><label>Baffi</label><select id="iBaffi">
        <option value="1">Sì, con baffi</option><option value="0">No, sbarbato</option></select></div>
      <div style="width:150px;height:185px;margin:0 auto 10px"><div id="introAv" style="width:100%;height:100%"></div></div>
      <button class="btn full big" id="next">Avanti</button>`;
    $('#iCapelli').value=(S.look&&S.look.capelli)||'grigi';
    $('#iBaffi').value=(S.look&&S.look.baffi)?'1':'0';
    avIntro=AvatarView($('#introAv')); avIntro.set(1, 0.7, false); avIntro.respira(true);
    const agg=()=>{ S.look={capelli:$('#iCapelli').value, baffi:$('#iBaffi').value==='1'}; avIntro.mood(0.7); };
    $('#iCapelli').onchange=agg; $('#iBaffi').onchange=agg;
  }
  if(passo===2){
    b.innerHTML=`${pallini()}
      <h1>Dove vogliamo arrivare?</h1>
      <p>Scegli il traguardo del <b>mio</b> peso. Non è il tuo: io sono un gioco, corro più veloce di te. Serve solo a vedere i progressi.</p>
      <div class="field"><label>Il mio obiettivo (kg)</label>
        <input type="number" id="iObiettivo" value="${S.obiettivo}" min="55" max="99" inputmode="numeric"></div>
      <div class="field"><label>La tua altezza in cm — facoltativa, serve per il BMI</label>
        <input type="number" id="iAltezza" value="${S.altezza||''}" min="120" max="220" inputmode="numeric" placeholder="es. 175"></div>
      <div class="field"><label>Il tuo peso vero oggi — facoltativo</label>
        <input type="number" step="0.1" id="iPeso" inputmode="decimal" placeholder="resta solo su questo telefono"></div>
      <button class="btn full big" id="next">Avanti</button>`;
  }
  if(passo===3){
    b.innerHTML=`${pallini()}
      <h1>Come si gioca</h1>
      <div class="q"><div class="qi">💪</div><div class="qb"><b>Muoviti davvero</b><span>L'app conta il ritmo, tu fai gli squat. Poi confermi.</span></div></div>
      <div class="q"><div class="qi">🍎</div><div class="qb"><b>Trascina il cibo su di me</b><span>Sano = dimagrisco. Sgarro = ingrasso, ma l'onestà premia.</span></div></div>
      <div class="q"><div class="qi">🗑️</div><div class="qb"><b>Butta le tentazioni</b><span>«Ho resistito» è la mossa che vale di più.</span></div></div>
      <div class="q"><div class="qi">😴</div><div class="qb"><b>Non sparire</b><span>Dopo 2 giorni fermi ricomincio a mettere su peso.</span></div></div>
      <div class="q"><div class="qi">💡</div><div class="qb"><b>Impara qualcosa</b><span>Ogni giorno una curiosità vera su corpo e cibo.</span></div></div>
      <p style="font-size:13px;margin-top:14px">I tuoi dati restano su questo dispositivo: niente account, niente internet.</p>
      <button class="btn full big" id="next">Cominciamo! 🚀</button>`;
  }
  $('#next').onclick=avantiIntro;
}
function avantiIntro(){
  AU.ensure(); AU.pop();
  if(passo===1){
    S.nomeAvatar=($('#iNome').value||'Bruno').trim().slice(0,16)||'Bruno';
    S.look={capelli:$('#iCapelli').value, baffi:$('#iBaffi').value==='1'};
  }
  if(passo===2){
    S.obiettivo=clamp(Number($('#iObiettivo').value)||BAL.obiettivoDefault,55,99);
    S.altezza=clamp(Number($('#iAltezza').value)||0,0,250);
    const pv=Number($('#iPeso').value);
    if(pv>=30&&pv<=300) S.pesiReali=[{d:dayKey(), kg:r1(pv)}];
  }
  passo++;
  if(passo>3){
    S.onboarded=true; salva();
    $('#intro').classList.add('hidden'); $('#intro').innerHTML='';
    $('#app').style.display=''; $('.nav').style.display='';
    if(S.audio.musica) AU.musicaOn();
    FX.pioggia(90); AU.livello();
    render();
    setTimeout(()=>toast('Benvenuto! 🌱','Comincia con una sfida di oggi','ok'),700);
    return;
  }
  salva(); disegnaIntro();
}

/* =========================================================================
   18. AVVIO
   ========================================================================= */
let promptInstall=null;
addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); promptInstall=e; });

function aggiornaBottoniAudio(){
  const m=$('#btnMusic'), s=$('#btnSfx');
  if(!m||!s) return;
  m.classList.toggle('off', !S.audio.musica);
  s.classList.toggle('off', !S.audio.sfx);
  m.textContent = S.audio.musica? '🎵':'🔇';
  s.textContent = S.audio.sfx? '🔊':'🔈';
}

function avvia(){
  FX.init();
  carica();
  const esito=controlloGiorno();

  $$('#nav button').forEach(b=>b.onclick=()=>vai(b.dataset.tab));
  $('#btnMusic').onclick=()=>{
    S.audio.musica=!S.audio.musica; salva();
    S.audio.musica? AU.musicaOn() : AU.musicaOff();
    aggiornaBottoniAudio();
    toast(S.audio.musica?'Musica accesa 🎵':'Musica spenta 🔇','','ok');
  };
  $('#btnSfx').onclick=()=>{
    S.audio.sfx=!S.audio.sfx; salva(); aggiornaBottoniAudio();
    if(S.audio.sfx) AU.buono();
  };

  if(!S.onboarded){ mostraIntro(); }
  else{
    render();
    if(esito) setTimeout(()=>{
      AU.cattivo();
      apriSheet(`<h3>😴 Quanto tempo!</h3>
        <p>Sono passati <b>${esito.giorni} giorni</b> dall'ultima volta. ${esc(S.nomeAvatar)} nel frattempo ha ripreso <b>${esito.malus.toFixed(1)} kg</b>.</p>
        <p>Nessun dramma: si recupera in una sessione. La regola d'oro è non saltare mai due giorni di fila.</p>
        <button class="btn full big" data-close>Rimettiamoci in moto 💪</button>`);
    },600);
  }

  // musica: parte al primo tocco (i browser lo richiedono)
  const sblocca=()=>{
    AU.ensure();
    if(S.audio.musica && !AU.on) AU.musicaOn();
    removeEventListener('pointerdown',sblocca); removeEventListener('keydown',sblocca);
  };
  addEventListener('pointerdown',sblocca); addEventListener('keydown',sblocca);

  // rientro nell'app: controlla se è cambiato giorno
  addEventListener('visibilitychange',()=>{
    if(document.hidden){ AU.musicaOff(); return; }
    if(!S.onboarded) return;
    const esito2=controlloGiorno();
    render();
    if(S.audio.musica) AU.musicaOn();
    if(esito2) toast('Hai saltato qualche giorno 😴', `${S.nomeAvatar} ha ripreso ${esito2.malus.toFixed(1)} kg`, 'warn');
  });

  if('serviceWorker' in navigator)
    addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}

document.addEventListener('DOMContentLoaded', avvia);
window.FQ = { get stato(){return S;}, salva, render, azzera(){ localStorage.removeItem(SAVE_KEY); location.reload(); } };
</script>
</body>
</html>
